env: dev

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  mode: release

log:
  level: info
  encoding: json
  # 日志文件由 app/config 按启动模式追加：HTTP 写 storage/log/http/<date>/，
  # 脚本写 storage/log/script/<date>/info/ 和 error/，文件名取自脚本名
  # （fix-order-h<H>.log、fix-order.log）；这里保留 stdout 方便本地查看。
  outputs:
    - stdout
  rotation:
    enabled: true
    # info.log 按小时切分（info-h0.log ... info-h23.log）；error.log 和
    # system_error.log 固定按大小切分，避免每小时产生碎片文件。
    mode: hourly
    date_dir: true
    date_layout: "20060102"
    date_dir_max_age_days: 7   # 超过 7 天删除整个日期目录
    max_size_mb: 100
    max_age_days: 30
    max_backups: 7
    compress: true
    local_time: true
  base_fields:
    service: demo-service

db:
  default:
    dsn: &demo_dsn swoolefy:swoolefy123@tcp(192.168.10.187:3306)/gofy?charset=utf8mb4&parseTime=True&loc=Local
    max_idle_conns: 10
    max_open_conns: 50
    conn_max_lifetime: 1h
    conn_max_idle_time: 10m
    ping_timeout: 5s
    slow_threshold: 200ms
    log_level: warn
    prepare_stmt: false
  # 演示多实例：order/product 复用同一套 dev 库（YAML 锚点），实际项目换成
  # 各自的 DSN；业务侧句柄见 app/io/mysql 的 OrderDb、ProductDb。
  order:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5
  product:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5

# 多实例 Redis：按名字分组，由 app/io 包在启动时建连、关停时关闭；
# 业务句柄见 app/io/redis 的 Cache、Session、RateLimit。enabled 为 false
# 时不建连，因此本地没有 Redis 也能启动；dev-redis 启用了密码认证，
# 三个实例都带 password: redis123，换成免密 Redis 时删掉该行即可。
# 密码建议通过环境变量注入，不要提交到仓库。
redis:
  cache:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 0
    pool_size: 10
  session:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 1
    pool_size: 5
  # 限流专用实例，默认启用。
  ratelimit:
    enabled: true
    addr: 192.168.10.187:6379
    password: redis123
    db: 2
    pool_size: 5

pid_file: app/demo-service.pid

order:
  payment_timeout: 6s
  # auth_token: set to require a bearer token on every contract route
