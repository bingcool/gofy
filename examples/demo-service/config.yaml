env: dev

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  mode: release

# 运维端点：Prometheus 指标与 net/http/pprof，跑在独立端口，绝不使用业务端口。
# 默认关闭。pprof 会输出堆内容、协程栈与命令行（含启动参数），生产环境应把该端口
# 限制在管理网络，或设置 disable_pprof: true。
diagnostics:
  enabled: false          # 打开后 /metrics 与 /debug/pprof/ 同时可用
  addr: 127.0.0.1:6060    # Prometheus 从其他 Pod 抓取时改为 0.0.0.0:6060
  # disable_pprof: true   # 不允许堆转储离开进程时关掉
  # disable_metrics: true # 只要 pprof
  # metrics_path: /metrics

log:
  level: info
  encoding: json
  # 终端着色：auto 只在 TTY 上生效，always 供 IDE 控制台（非 TTY）强制开启，
  # never 关闭。生效时 error 及以上按红色多行块输出：error 单独一行、
  # stacktrace 逐帧展开；文件日志永不着色，NO_COLOR 与 Windows 始终关闭。
  color: always
  # 日志文件由 app/config 按启动模式追加：HTTP 写 storage/log/http/<date>/，
  # 访问日志单独写 storage/log/access/<date>/access.log；脚本写
  # storage/log/script/<date>/info/ 和 error/，文件名取自脚本名
  # （fix-order-h<H>.log、fix-order.log）；SQL 条目在每种模式下都单独写
  # storage/log/sql/<date>/sql-h<H>.log。这里保留 stdout 方便本地查看。
  outputs:
    - stdout
  rotation:
    enabled: true
    # mode 只有两个合法值，大小写不敏感，留空等同 size，其它值启动期报错：
    #   size   —— 默认。info.log 一直追加，满 max_size_mb 由 lumberjack 滚成带
    #             时间戳的备份，受 max_age_days / max_backups / compress 约束。
    #   hourly —— 每小时一个文件（info-h0.log ... info-h23.log，h 不补零）；
    #             上面四个按大小保留的参数全部失效，旧日志只能靠 date_dir +
    #             date_dir_max_age_days 删除整个日期目录来清理。
    # mode 只作用于 outputs；error.log 和 system_error.log 固定按 size 切分，
    # 避免每小时产生碎片文件。enabled: false 时 mode 被忽略。
    mode: hourly
    date_dir: true
    date_layout: "20060102"
    date_dir_max_age_days: 7   # 超过 7 天删除整个日期目录
    max_size_mb: 100
    max_age_days: 30
    max_backups: 7
    compress: true
    local_time: true
  base_fields:
    service: demo-service

# OpenTelemetry tracing：span 通过 OTLP 发送到 collector（Jaeger/Tempo/厂商后端）。
# enabled=false 时不安装中间件、不建 exporter，本地开发默认关闭。
# 协议 grpc 对应 OTLP gRPC（4317），http 对应 OTLP HTTP（4318）。
# service_name/version/environment 留空时分别取 App 名称、构建版本和上面的 env。
# global 保持 false：一个进程可能运行多个 App，避免互相覆盖全局 provider。
# collector 需要鉴权时用 headers 传 Authorization，值建议由环境变量注入。
otel:
  enabled: false
  endpoint: 127.0.0.1:4317
  protocol: grpc
  insecure: true          # 内网明文 collector；公网部署改为 false 并配置 tls
  compression: gzip
  timeout: 10s
  sampler: parentbased_traceidratio
  sample_ratio: 1.0
  service_name: demo-service
  shutdown_timeout: 5s
  batch:
    timeout: 5s
    max_queue_size: 2048
    max_export_batch_size: 512
    export_timeout: 30s

# SQL 日志（进程级，所有连接共享）。enabled 是总开关，默认 false：关闭时不产生任何
# SQL 日志行（慢 SQL 与错误 SQL 都没有），也不校验本节其余字段。开启后 mode 决定
# 文本形态：off 只留错误与耗时，placeholder 是模板（默认），full 是展开后的语句。
# 脱敏是独立开关：mask.enabled 默认 false，开启后使用框架内置表 + 下面追加的项。
# SQL logs are process-wide. enabled defaults to false; when off no SQL entry is
# written at all. mask is an independent switch using the framework's built-in
# table plus whatever this project appends.
sql_log:
  enabled: true
  mode: full
  sample_rate: 0.01
  max_length: 4096
  log_schema_queries: false
  error_rate_limit: 20
  slow_rate_limit: 0
  mask:
    enabled: false
    strategy: mask
    # columns: [employee_no]
    # patterns: ["re:^ORD[0-9]{12}$"]

db:
  default:
    dsn: &demo_dsn swoolefy:swoolefy123@tcp(192.168.10.187:3306)/gofy?charset=utf8mb4&parseTime=True&loc=Local
    max_idle_conns: 10
    max_open_conns: 50
    conn_max_lifetime: 1h
    conn_max_idle_time: 10m
    ping_timeout: 5s
    slow_threshold: 200ms
    log_level: warn
    prepare_stmt: false
  # 演示多实例：order/product 复用同一套 dev 库（YAML 锚点），实际项目换成
  # 各自的 DSN；业务侧句柄见 app/io/db 的 OrderDb、ProductDb。
  order:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5
  product:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5
  # 其它名字（如 selectDb）支持任何兼容 MySQL 协议的服务器（MySQL、MariaDB、
  # TiDB、OceanBase 等），启动时不建连，业务用 db.NewIO(ctx, "selectDb") 懒加载。
  # selectDb:
  #   dsn: *demo_dsn
  #   max_open_conns: 5

# 多实例 Redis：按名字分组，由 app/io 包在启动时建连、关停时关闭；
# 业务句柄见 app/io/redis 的 Cache、Session、RateLimit。enabled 为 false
# 时不建连，因此本地没有 Redis 也能启动；dev-redis 启用了密码认证，
# 三个实例都带 password: redis123，换成免密 Redis 时删掉该行即可。
# 密码建议通过环境变量注入，不要提交到仓库。
redis:
  cache:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 0
    pool_size: 10
  session:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 1
    pool_size: 5
  # 限流专用实例，默认启用。
  ratelimit:
    enabled: true
    addr: 192.168.10.187:6379
    password: redis123
    db: 2
    pool_size: 5

# 分布式自增 ID：由 app/appio 用 support/uuidint 构建生成器，绑定本代 Redis 客户端，
# 取号不依赖之后 Reload 安装的新 Registry；enabled 为 false 时句柄为 nil。
# redis_instance_name 与 key 都必填，省略会在启动期报错，不会偷偷套用默认值。
# redis_instance_name 必须指向上面已启用的 redis 实例。
# 主实例重试全部失败后可降级到备用实例，该选项留空即不启用：
#   fallback_redis_instance_name: cache
# 备用同样必须已启用、且不能与主实例同名，可以是另一台独立 Redis：框架在切换前停顿
# 10ms，让备用的毫秒前缀与主实例错开，两边各自从 1 开始的计数器就不会发出重复 ID。
# 启用前先把对应 redis 实例的 enabled 改为 true。
# 脚本模式不经过模块生命周期，可用 script gen-uuid 直接验证（见下方脚本）。
uuidint:
  enabled: true
  redis_instance_name: ratelimit
  # fallback_redis_instance_name: cache   # 可选；启用前先把 redis.cache.enabled 改为 true
  key: demo:uuid
  ttl: 15s
  retry_times: 3
  retry_interval: 150ms
  # 本地预取池：启动时预热 pool_size 个号，之后每 pool_interval 补一批；
  # 池满时跳过补货，连续 3 个周期无人消费会清空旧池。0 表示不用池。
  pool_size: 200
  pool_interval: 1s

# 分布式锁：app/appio 用 support/lock（redsync）构建，绑定本代 Redis 客户端。
# redis_instance_name 指向上面已启用的实例；留空即使用 support/redis 的 default 实例。
# prefix 是键命名空间，实际键为 "<prefix>:<业务键>"，两个应用共用一个库时用它隔离。
# expiry 必须长于临界区：锁在持有者仍在工作时过期就不再互斥；耗时不确定时在临界区里
# 调 Extend 续租。tries / retry_delay 只影响阻塞式 Lock，TryLock 永远只尝试一次。
# 开两个终端跑 `script lock-check --hold 30s` 与 `script lock-check --try` 可验证互斥
lock:
  enabled: true
  redis_instance_name: ratelimit
  prefix: demo:lock
  expiry: 10s
  tries: 3
  retry_delay: 100ms

# 多实例 AMQP（RabbitMQ）：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 amqp.Default，其它实例用 amqp.Get("名字") 取用。
# 本机 dev-rabbitmq 的凭据来自 dockerfiles/docker-compose.yml
# （rabbitmq / 123456 / vhost my_vhost）；没有 RabbitMQ 时把 enabled 改成
# false，服务仍可启动。hosts 可配置多个 broker 节点，按顺序尝试连接。
amqp:
  default:
    enabled: true
    hosts:
      - host: 127.0.0.1
        port: 5672
        username: rabbitmq
        password: 123456
        vhost: my_vhost
    heartbeat: 10s
    connection_timeout: 5s
  # 演示第二个实例：同一个 broker 上的独立连接，按需打开。
  order:
    enabled: false
    hosts:
      - host: 127.0.0.1
        port: 5672
        username: rabbitmq
        password: 123456
        vhost: my_vhost

# 多实例 Kafka：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 kafka.Default，其它实例用 kafka.Get("名字") 取用。
# broker 来自 dockerfiles/docker-compose.yml 的 dev-kafka；容器宣告地址是
# 宿主机 LAN IP，宿主机 IP 变化时同步修改 brokers，或用
# HOST_IP=192.168.x.x docker compose up -d 重新启动 Kafka。
# Producer 共享连接；Consumer 会按消费者组单独建客户端。
kafka:
  default:
    enabled: true
    brokers:
      - 127.0.0.1:9092
    client_id: demo-service
    dial_timeout: 5s
    idempotent: false
    record_retries: 10
  # 演示第二个实例：独立连接，按需打开。
  order:
    enabled: false
    brokers:
      - 127.0.0.1:9092

# 多实例 RocketMQ：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 rocketmq.Default，其它实例用 rocketmq.Get("名字") 取用。
# v5 走 gRPC proxy（默认 8081），不再是 nameserver 9876；topic 由业务在发布时
# 指定，这里不配置；本机没有 RocketMQ 或 proxy 时把 enabled 保持 false。
# 集群开启 ACL 时成对填写 access_key / access_secret；消费者按需传 group，
# 生产者不再注册 producer group。
rocketmq:
  default:
    enabled: false
    endpoint: 127.0.0.1:8081
    send_timeout: 3s
    max_attempts: 3
  # 演示第二个实例：独立 producer，按需打开。
  order:
    enabled: false
    endpoint: 127.0.0.1:8081

# 常驻消费者没有配置段：每个订阅是 worker/group1 里的一个文件，topic、消费组、
# 并发与 handler 都写在那个文件里（像扫描节奏写在 scan.go 一样）。这里只保留
# broker 连接参数，消费者的 instance 字段按名字引用它们。

# 就绪探针默认不开；需要时在 options.go 里加 gofy.WithWorkerHealth(addr)。
pid_file: app/demo-service.pid

# 契约在分组上显式声明了 "auth" 中间件，其内部用框架 JWT
# （support/middleware/jwt.go）校验 Bearer Token。secret 为空时示例放行；
# 生产环境从环境变量（如 JWT_SECRET）注入，建议不要写进 YAML。
# 需要开启时取消注释并填入密钥：
# jwt:
#   secret: <从 JWT_SECRET 注入，不要提交>
#   algorithms: [HS256]
#   issuer: demo-service
#   audience: demoservice
#   require_expiry: true

# 业务配置：订单模块自己的一段配置。装配根 app/container 把它翻译成
# orderservice.Settings 后注入，service 不 import app/config，也不读文件；
# 因此加字段只改这里、app/config 与装配根，不牵动其它模块。
# auth_required 决定 GET /api/v1/order/config 的响应，默认 false 与旧样例一致。
# 改这一段需要重启或触发热更新（配置变更按整代重建，在途请求继续用旧值）。
order:
  auth_required: false

# 本服务自己的内网部署地址（不是下游地址表）。两个用途：
#   1. 服务注册时写入 Nacos 实例 metadata 的 inner_external_base_uri——Pod IP 在办公网
#      路由不到，解析到本实例的调用方可以改用这个地址；
#   2. 本进程按服务名调用自己失败时，用它再试一次。本地调试因此不必启动本地服务：拉 dev
#      的这份配置，打没起的本地实例失败后自动降级到 dev 的部署（需要本地能访问该地址）。
# demo 只按一个服务名（demo-service）调用，所以一个值够用；调多个下游时兜底要按下游分别
# 配置，不能共用这一个。留空表示不写 metadata、也不降级。
# 生产环境必须填本环境自己的地址，填成别的环境等于把故障流量导过去。
# timeout 是**每次尝试**的上限（含寻址），默认 5s。降级是第二次尝试，所以同一次逻辑调用
# 最坏耗时是 2×timeout：本地配 5s，打不通本地实例再打部署地址，最坏 10s。两次尝试共用
# 调用方的 context，调用方自己的 deadline 仍然是硬上限。
# 服务发现自身的超时在 application.yaml 的 timeout_ms，与它无关。
# 客户端由 main 构造一次、进程内共享，reload 不重建（resolver 的缓存与游标要跨代存活）。
client:
  inner_external_base_uri: ''
  timeout: 5s

# 行级租户隔离（support/tenant）。默认关闭：装上插件后，只有声明了 tenant_id 列的
# 模型会被自动追加 WHERE 条件 / 填充 INSERT 列，其它表保持普通 GORM 行为。
# 租户 ID 来自 frameworkcontext（本地 JWT 身份优先，其次可信上游的 X-Tenant-Id 透传），
# 因此业务代码不用把租户号一层层传进 repository。目标表需要隔离却没有租户 ID 时
# 操作会被拒绝（失败关闭），不会退化成"不过滤"。运维脚本要跨租户请用 tenant.Without(ctx)。
tenant:
  enabled: false
  column: tenant_id          # 与模型的 gorm column 标签一致
  overwrite_explicit: false  # true 时 INSERT 强制使用当前租户，忽略调用方显式赋值

# LLM 接入（support/ai）。alias 是业务代码使用的名字，与 provider 的 wire model id
# 解耦；模块按 alias 调用，不关心 base_url 与凭证来自哪里。
#
# 密钥不写明文：下面用美元花括号占位指向一个环境变量（见 api_key 那行），只在 New 时解析；
# 变量缺失则启动直接失败（fail-fast）。密钥因此留在部署环境里，既不进仓库，也不进任何
# "写进程环境变量"的路径。运行前先 export DEEPSEEK_API_KEY=...
# 不需要大模型时把下面的 enabled 设为 false（或删掉整段）：没有使用方会构造客户端，
# 启动不受影响（demo 的用法见 worker/group3/ai_check.go，不挂 HTTP 路由）。
# 注意占位符在 YAML 解析之前就会展开；想在 enabled 为 false 时也不要求该变量，
# 把 api_key 写成 $${DEEPSEEK_API_KEY}（New 才解析，关闭时不会走到 New）。
#
# 完整字段（超时、重试、工具循环、embedding、provider_options 等）见
# support/ai/README.md；这里只保留 demo 用得到的一组，加字段只改配置不动代码。
llm_ai:
  # 总开关。false 或整段缺失时：不构造客户端、其余字段不再校验，
  # 因此可以先保留一份写好的配置而把开关关着。
  enabled: true
  default_model: deepseek-chat

  models:
    deepseek-chat:
      provider: deepseek
      model: deepseek-chat
      # api_key 支持两种写法：字面量，或下一行这种美元花括号占位，从环境变量读取。
      # 占位符在 New 时解析；但 config.Load 在 YAML 解析之前就会展开它，所以变量
      # 缺失会在加载期报错，即使 enabled 为 false。要让占位符穿过加载、留到 New 再
      # 读取（关闭时完全不要求变量），把下一行写成 $${DEEPSEEK_API_KEY}。
      api_key: ${DEEPSEEK_API_KEY}
      timeout: 60s
      max_retries: 2
      temperature: 0.7
      max_output_tokens: 2048
      # DeepSeek 只接受 response_format=json_object，不接受 json_schema，
      # 而 goai 默认按 schema 发。这一个开关把它降级成 json_object，
      # 是"兼容端点差异靠配置表达、不在框架里写厂商分支"的例子。
      provider_options:
        structuredOutputs: false

    # OpenAI 兼容路径的示例：同一个 DeepSeek 端点换 openai_compatible 再走一遍，
    # 证明"换协议实现不改代码"。换成千问 / 文心时只改 base_url 与 api_key，
    # provider 差异全部落在配置里。group3 的巡检会逐个 alias 调用（worker/group3/ai_check.go）。
    deepseek-compat:
      provider: openai_compatible
      model: deepseek-chat
      base_url: https://api.deepseek.com/v1
      api_key: ${DEEPSEEK_API_KEY}
      provider_id: deepseek-compat
      timeout: 60s
      max_retries: 2
      temperature: 0.7
      max_output_tokens: 2048

    # 换成别的 OpenAI 兼容端点（如千问）时，复制上面这段改 base_url 与 api_key 即可。
    # 取消注释时把 api_key 换成 <your-dashscope-key>，或写美元花括号占位从环境读取
    # （注释里要写成两个美元号转义，否则加载期会被当作占位符展开而要求变量）。
    # qwen-max:
    #   provider: openai_compatible
    #   model: qwen-max
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: <your-dashscope-key>
    #   provider_id: qwen
    #   timeout: 90s
