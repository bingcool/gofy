env: dev

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  mode: release

log:
  level: info
  encoding: json
  # 终端着色：auto 只在 TTY 上生效，always 供 IDE 控制台（非 TTY）强制开启，
  # never 关闭。生效时 error 及以上按红色多行块输出：error 单独一行、
  # stacktrace 逐帧展开；文件日志永不着色，NO_COLOR 与 Windows 始终关闭。
  color: always
  # 日志文件由 app/config 按启动模式追加：HTTP 写 storage/log/http/<date>/，
  # 脚本写 storage/log/script/<date>/info/ 和 error/，文件名取自脚本名
  # （fix-order-h<H>.log、fix-order.log）；这里保留 stdout 方便本地查看。
  outputs:
    - stdout
  rotation:
    enabled: true
    # mode 只有两个合法值，大小写不敏感，留空等同 size，其它值启动期报错：
    #   size   —— 默认。info.log 一直追加，满 max_size_mb 由 lumberjack 滚成带
    #             时间戳的备份，受 max_age_days / max_backups / compress 约束。
    #   hourly —— 每小时一个文件（info-h0.log ... info-h23.log，h 不补零）；
    #             上面四个按大小保留的参数全部失效，旧日志只能靠 date_dir +
    #             date_dir_max_age_days 删除整个日期目录来清理。
    # mode 只作用于 outputs；error.log 和 system_error.log 固定按 size 切分，
    # 避免每小时产生碎片文件。enabled: false 时 mode 被忽略。
    mode: hourly
    date_dir: true
    date_layout: "20060102"
    date_dir_max_age_days: 7   # 超过 7 天删除整个日期目录
    max_size_mb: 100
    max_age_days: 30
    max_backups: 7
    compress: true
    local_time: true
  base_fields:
    service: demo-service

# OpenTelemetry tracing：span 通过 OTLP 发送到 collector（Jaeger/Tempo/厂商后端）。
# enabled=false 时不安装中间件、不建 exporter，本地开发默认关闭。
# 协议 grpc 对应 OTLP gRPC（4317），http 对应 OTLP HTTP（4318）。
# service_name/version/environment 留空时分别取 App 名称、构建版本和上面的 env。
# global 保持 false：一个进程可能运行多个 App，避免互相覆盖全局 provider。
# collector 需要鉴权时用 headers 传 Authorization，值建议由环境变量注入。
otel:
  enabled: false
  endpoint: 127.0.0.1:4317
  protocol: grpc
  insecure: true          # 内网明文 collector；公网部署改为 false 并配置 tls
  compression: gzip
  timeout: 10s
  sampler: parentbased_traceidratio
  sample_ratio: 1.0
  service_name: demo-service
  shutdown_timeout: 5s
  batch:
    timeout: 5s
    max_queue_size: 2048
    max_export_batch_size: 512
    export_timeout: 30s

db:
  default:
    dsn: &demo_dsn swoolefy:swoolefy123@tcp(192.168.10.187:3306)/gofy?charset=utf8mb4&parseTime=True&loc=Local
    max_idle_conns: 10
    max_open_conns: 50
    conn_max_lifetime: 1h
    conn_max_idle_time: 10m
    ping_timeout: 5s
    slow_threshold: 200ms
    log_level: warn
    prepare_stmt: false
  # 演示多实例：order/product 复用同一套 dev 库（YAML 锚点），实际项目换成
  # 各自的 DSN；业务侧句柄见 app/io/db 的 OrderDb、ProductDb。
  order:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5
  product:
    dsn: *demo_dsn
    max_idle_conns: 2
    max_open_conns: 5
  # 其它名字（如 selectDb）支持任何兼容 MySQL 协议的服务器（MySQL、MariaDB、
  # TiDB、OceanBase 等），启动时不建连，业务用 db.NewIO(ctx, "selectDb") 懒加载。
  # selectDb:
  #   dsn: *demo_dsn
  #   max_open_conns: 5

# 多实例 Redis：按名字分组，由 app/io 包在启动时建连、关停时关闭；
# 业务句柄见 app/io/redis 的 Cache、Session、RateLimit。enabled 为 false
# 时不建连，因此本地没有 Redis 也能启动；dev-redis 启用了密码认证，
# 三个实例都带 password: redis123，换成免密 Redis 时删掉该行即可。
# 密码建议通过环境变量注入，不要提交到仓库。
redis:
  cache:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 0
    pool_size: 10
  session:
    enabled: false
    addr: 192.168.10.187:6379
    password: redis123
    db: 1
    pool_size: 5
  # 限流专用实例，默认启用。
  ratelimit:
    enabled: true
    addr: 192.168.10.187:6379
    password: redis123
    db: 2
    pool_size: 5

# 分布式自增 ID：由 app/io 用 support/uuidint 构建生成器，复用上面 redis 的
# 命名实例（redis_instance_name 必须是已启用的 redis 实例）。generator 不持有
# 连接，每次取号经 support/redis 的别名懒解析；enabled 为 false 时句柄为 nil。
# 脚本模式不经过模块生命周期，可用 script gen-uuid 直接验证（见下方脚本）。
uuidint:
  enabled: true
  redis_instance_name: ratelimit
  key: demo:uuid
  ttl: 15s
  retry_times: 3
  retry_interval: 150ms
  # 本地预取池：启动时预热 pool_size 个号，之后每 pool_interval 补一批；
  # 池满时跳过补货，连续 3 个周期无人消费会清空旧池。0 表示不用池。
  pool_size: 200
  pool_interval: 1s

# 多实例 AMQP（RabbitMQ）：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 amqp.Default，其它实例用 amqp.Get("名字") 取用。
# 本机 dev-rabbitmq 的凭据来自 dockerfiles/docker-compose.yml
# （rabbitmq / 123456 / vhost my_vhost）；没有 RabbitMQ 时把 enabled 改成
# false，服务仍可启动。hosts 可配置多个 broker 节点，按顺序尝试连接。
amqp:
  default:
    enabled: true
    hosts:
      - host: 127.0.0.1
        port: 5672
        username: rabbitmq
        password: 123456
        vhost: my_vhost
    heartbeat: 10s
    connection_timeout: 5s
  # 演示第二个实例：同一个 broker 上的独立连接，按需打开。
  order:
    enabled: false
    hosts:
      - host: 127.0.0.1
        port: 5672
        username: rabbitmq
        password: 123456
        vhost: my_vhost

# 多实例 Kafka：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 kafka.Default，其它实例用 kafka.Get("名字") 取用。
# broker 来自 dockerfiles/docker-compose.yml 的 dev-kafka；容器宣告地址是
# 宿主机 LAN IP，宿主机 IP 变化时同步修改 brokers，或用
# HOST_IP=192.168.x.x docker compose up -d 重新启动 Kafka。
# Producer 共享连接；Consumer 会按消费者组单独建客户端。
kafka:
  default:
    enabled: true
    brokers:
      - 127.0.0.1:9092
    client_id: demo-service
    dial_timeout: 5s
    idempotent: false
    record_retries: 10
  # 演示第二个实例：独立连接，按需打开。
  order:
    enabled: false
    brokers:
      - 127.0.0.1:9092

# 多实例 RocketMQ：按名字分组，由 app/io 建连和关闭。
# default 对应业务句柄 rocketmq.Default，其它实例用 rocketmq.Get("名字") 取用。
# v5 走 gRPC proxy（默认 8081），不再是 nameserver 9876；topic 由业务在发布时
# 指定，这里不配置；本机没有 RocketMQ 或 proxy 时把 enabled 保持 false。
# 集群开启 ACL 时成对填写 access_key / access_secret；消费者按需传 group，
# 生产者不再注册 producer group。
rocketmq:
  default:
    enabled: false
    endpoint: 127.0.0.1:8081
    send_timeout: 3s
    max_attempts: 3
  # 演示第二个实例：独立 producer，按需打开。
  order:
    enabled: false
    endpoint: 127.0.0.1:8081

pid_file: app/demo-service.pid

# 契约在分组上显式声明了 "auth" 中间件，其内部用框架 JWT
# （support/middleware/jwt.go）校验 Bearer Token。secret 为空时示例放行；
# 生产环境从环境变量（如 JWT_SECRET）注入，建议不要写进 YAML。
# 需要开启时取消注释并填入密钥：
# jwt:
#   secret: <从 JWT_SECRET 注入，不要提交>
#   algorithms: [HS256]
#   issuer: demo-service
#   audience: demoservice
#   require_expiry: true
