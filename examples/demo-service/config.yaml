env: dev

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  mode: release

log:
  level: info
  encoding: json
  outputs:
    - stdout
  rotation:
    enabled: false
    max_size_mb: 100
    max_age_days: 30
    max_backups: 7
    compress: true
  base_fields:
    service: demo-service

db:
  dsn: swoolefy:swoolefy123@tcp(192.168.10.187:3306)/gofy?charset=utf8mb4&parseTime=True&loc=Local
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m
  ping_timeout: 5s
  slow_threshold: 200ms
  log_level: warn
  prepare_stmt: false

pid_file: app/demo-service.pid

order:
  payment_timeout: 3s
  # auth_token: set to require a bearer token on every contract route
