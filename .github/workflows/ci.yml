name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: example module
        working-directory: examples/order-service
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: default project
        run: |
          go run ./cmd/gofy new demo \
            --module example.com/demo \
            --dir "$RUNNER_TEMP/demo" \
            --replace "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo"
          go mod tidy
          go build ./...
          go vet ./...
      - name: database and docker project
        run: |
          go run ./cmd/gofy new order-service \
            --module example.com/order-service \
            --dir "$RUNNER_TEMP/order-service" \
            --replace "$GITHUB_WORKSPACE" \
            --with-db \
            --with-docker
          cd "$RUNNER_TEMP/order-service"
          go mod tidy
          go build ./...
          go vet ./...

  guards:
    name: import and init guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: import direction
        run: ./scripts/check-imports.sh
      - name: no init in public packages
        run: |
          if grep -rn "func init()" --include="*.go" \
            *.go apperr core transport logging support script command config gofytest internal; then
            echo "public packages must not use init()"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
